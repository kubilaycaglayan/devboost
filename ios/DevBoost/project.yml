name: DevBoost
options:
  minimumXcodeGenVersion: 2.38
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  Citadel: { url: https://github.com/orlandos-nl/Citadel.git, version: 0.9.2 }
  SwiftTerm: { url: https://github.com/migueldeicaza/SwiftTerm.git, version: 1.20.0 }
  swift-nio-ssh: { url: https://github.com/Joannis/swift-nio-ssh.git, version: 0.3.4 }
  swift-crypto: { url: https://github.com/apple/swift-crypto.git, version: 2.0.0 }
  swift-nio: { url: https://github.com/apple/swift-nio.git, version: 2.81.0 }
targets:
  DevBoost:
    type: application
    platform: iOS
    sources:
      - path: Sources/DevBoost
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.devboost
        PRODUCT_NAME: DevBoost
        INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-crypto
        product: Crypto
      - package: swift-nio
        product: NIO
  DevBoostTests:
    type: bundle.unit-test
    platform: iOS
    settings: { base: { GENERATE_INFOPLIST_FILE: YES } }
    sources:
      - path: Tests/DevBoostTests
    dependencies:
      - target: DevBoost
  DevBoostUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.devboost.uitests
    sources:
      - path: Tests/DevBoostUITests
    dependencies:
      - target: DevBoost
schemes:
  DevBoost:
    build: { targets: { DevBoost: all, DevBoostTests: test } }
    run: { config: Debug }
    test:
      config: Debug
      targets: [{ name: DevBoostTests }, { name: DevBoostUITests }]
