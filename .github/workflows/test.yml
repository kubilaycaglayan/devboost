name: Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Tests
        run: |
          python3 -m unittest discover tests -v

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run iOS unit and UI tests
        run: |
          # Runner images change their simulator set; use whichever iPhone is installed.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d = json.load(sys.stdin)['devices']; print(next(x['udid'] for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Using simulator $UDID"
          xcodebuild test \
            -project ios/DevBoost/DevBoost.xcodeproj \
            -scheme DevBoost \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
